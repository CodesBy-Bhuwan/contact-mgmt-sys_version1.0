spring.application.name=full-stack-contactMgmtSys

#Port
server.port=5454

#Thyemeleaf
spring.thymeleaf.cache=false

#Changing Database
spring.profiles.active=sqlite
#spring.profiles.active=mysql

#spring.profiles.active=sqlite
spring.datasource.url=jdbc:sqlite:mydb.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
#spring.profiles.active=mysql


spring.jpa.show-sql=true

#Security configuration
#spring.security.user.name=root
#spring.security.user.password=root

# This is to login using google with single click:
#oauth2 client configuration for google
spring.security.oauth2.client.registration.google.client-name=${google}
spring.security.oauth2.client.registration.google.client-id=${googleClientId}
spring.security.oauth2.client.registration.google.client-secret=${googleClientSecret}

# For Facebook
spring.security.oauth2.client.registration.facebook.client-name=${facebook}
spring.security.oauth2.client.registration.facebook.client-id=${facebookClientId}
spring.security.oauth2.client.registration.facebook.client-secret=${facebookClientSecret}


# --- Frontend wiring ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.oauth2.success-redirect=http://localhost:5173/
app.oauth2.form-success-redirect=/user/dashboard


# --- Uploads (profile pics) ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- AES key for contact password encryption. Override with env var in production! ---
app.encryption.key=${APP_ENCRYPTION_KEY:dev-only-aes-key-change-me}

# --- Register first, then set ADMIN_EMAIL and restart to promote ---
app.admin.email=${ADMIN_EMAIL:}